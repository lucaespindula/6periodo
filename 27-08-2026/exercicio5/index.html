<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard Administrativo ESAMC</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Painel Administrativo ESAMC</h1>
    </header>

    <div class="dashboard">

        <aside class="menu">

            <ul>
                <li>Dashboard</li>
                <li>Usuários</li>
                <li>Relatórios</li>
                <li>Administrativo</li>
                <li>Configurações</li>
            </ul>

        </aside>

        <section class="cards">

            <div class="card vendas">
                <h2>Vendas</h2>
                <p>R$ 95.000</p>
            </div>

            <div class="card usuarios">
                <h2>Usuários</h2>
                <p>13.250</p>
            </div>

            <div class="card pedidos">
                <h2>Pedidos</h2>
                <p>350</p>
            </div>

            <div class="card estoque">
                <h2>Estoque</h2>
                <p>80%</p>
            </div>

            <div class="card financeiro">
                <h2>Financeiro</h2>
                <p>R$ 1.250.000</p>
            </div>

            <div class="card alertas">
                <h2>Alertas</h2>
                <p>12 alertas</p>
            </div>

        </section>

    </div>

</body>

</html>
