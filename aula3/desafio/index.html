<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Perfil Interativo</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 500px;
      margin: 40px auto;
      transition: background-color 0.2s, color 0.2s;
    }

    .escuro {
      background-color: #111827;
      color: white;
    }

    button {
      margin: 4px 4px 4px 0;
      padding: 8px 12px;
      cursor: pointer;
    }

    #descricao {
      border: 1px solid #ccc;
      padding: 10px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h1 id="tituloPerfil">Olá, Visitante!</h1>

  <label for="campoNome">Seu nome:</label>
  <input type="text" id="campoNome" placeholder="Digite seu nome">
  <button id="botaoAtualizar">Atualizar nome</button>

  <p>Interações: <span id="contadorInteracoes">0</span></p>

  <button id="botaoDescricao">Mostrar / esconder descrição</button>
  <p id="descricao">
    Descrição bolada
  </p>

  <button id="botaoTema">Alternar tema</button>

  <script src="script.js"></script>
</body>
</html>
